name: Update fork trend

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/update_fork_trend.py
      - .github/workflows/update-fork-trend.yml

permissions:
  contents: write

concurrency:
  group: update-fork-trend
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate cumulative fork chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/update_fork_trend.py
          --repository "$GITHUB_REPOSITORY"
          --output assets/fork-trend.svg
      - name: Commit updated chart
        run: |
          if git diff --quiet -- assets/fork-trend.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fork-trend.svg
          git commit -m "docs: update fork trend"
          git push
